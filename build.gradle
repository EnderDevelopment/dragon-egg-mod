plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

extraProperties {
    minecraft_version = '1.21.11'
    yarn_mappings = '1.21.11+build.1'
    loader_version = '0.14.21'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.91.0+1.21"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.ext.minecraft_version
    from(sourceSets.main.resources.srcDirs) {
        include 'fabric.mod.json'
        expand 'version':project.version, 'minecraft_version':project.ext.minecraft_version
    }
    into "build/resources/main"
}
